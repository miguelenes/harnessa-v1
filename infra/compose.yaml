name: harnessa
services:
  db:
    image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harnessa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harnessa}
      POSTGRES_DB: ${POSTGRES_DB:-harnessa}
    networks: [app_internal]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.10.2-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_internal]
    ports:
      - "${REDIS_PORT:-6380}:6379"
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://harnessa:harnessa@db:5432/harnessa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REPOSITORY_TARGETS: ${REPOSITORY_TARGETS:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-30}
      RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-10}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      RUN_MAX_WALL_SECONDS: ${RUN_MAX_WALL_SECONDS:-1800}
      VERIFICATION_WORKSPACE_LIMIT_BYTES: ${VERIFICATION_WORKSPACE_LIMIT_BYTES:-1073741824}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      EVENT_REPLAY_LIMIT: ${EVENT_REPLAY_LIMIT:-500}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-10000}
      MODEL_GATEWAY_URL: http://litellm:4000
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
      MODEL_HTTP_TIMEOUT_SECONDS: ${MODEL_HTTP_TIMEOUT_SECONDS:-60}
      MODEL_COOLDOWN_SECONDS: ${MODEL_COOLDOWN_SECONDS:-30}
      MODEL_MAX_RETRY_AFTER_SECONDS: ${MODEL_MAX_RETRY_AFTER_SECONDS:-15}
      MODEL_RESERVATION_LEASE_SECONDS: ${MODEL_RESERVATION_LEASE_SECONDS:-180}
      MODEL_INTERACTIVE_CONCURRENCY: ${MODEL_INTERACTIVE_CONCURRENCY:-4}
      MODEL_INTERACTIVE_RESERVE: ${MODEL_INTERACTIVE_RESERVE:-2}
      MODEL_PROBE_OVERFLOW_LIMIT: ${MODEL_PROBE_OVERFLOW_LIMIT:-0}
      MCP_SERVERS_JSON: "${MCP_SERVERS_JSON:-{}}"
      MCP_READ_ONLY_TOOLS_JSON: "${MCP_READ_ONLY_TOOLS_JSON:-{}}"
      RETRIEVAL_APPROVED_SKILL_PATHS_JSON: "${RETRIEVAL_APPROVED_SKILL_PATHS_JSON:-{}}"
      GITHUB_SECRET_REFERENCES_JSON: "${GITHUB_SECRET_REFERENCES_JSON:-{}}"
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_HTTP_TIMEOUT_SECONDS: ${GITHUB_HTTP_TIMEOUT_SECONDS:-10}
      GITHUB_WEBHOOK_MAX_BYTES: ${GITHUB_WEBHOOK_MAX_BYTES:-262144}
      GITHUB_WEBHOOK_MAX_ATTEMPTS: ${GITHUB_WEBHOOK_MAX_ATTEMPTS:-12}
    networks: [app_internal]
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    volumes:
      - artifacts:/var/lib/harnessa/artifacts
    command: ["sh", "-c", "cd apps/api && uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn harnessa.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "harnessa.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8010}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8010}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    depends_on:
      - api
    networks: [app_internal]
  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://harnessa:harnessa@db:5432/harnessa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REPOSITORY_TARGETS: ${REPOSITORY_TARGETS:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-30}
      RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-10}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      RUN_MAX_WALL_SECONDS: ${RUN_MAX_WALL_SECONDS:-1800}
      VERIFICATION_WORKSPACE_LIMIT_BYTES: ${VERIFICATION_WORKSPACE_LIMIT_BYTES:-1073741824}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      EVENT_REPLAY_LIMIT: ${EVENT_REPLAY_LIMIT:-500}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-10000}
      MODEL_GATEWAY_URL: http://litellm:4000
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
      MODEL_HTTP_TIMEOUT_SECONDS: ${MODEL_HTTP_TIMEOUT_SECONDS:-60}
      MODEL_COOLDOWN_SECONDS: ${MODEL_COOLDOWN_SECONDS:-30}
      MODEL_MAX_RETRY_AFTER_SECONDS: ${MODEL_MAX_RETRY_AFTER_SECONDS:-15}
      MODEL_RESERVATION_LEASE_SECONDS: ${MODEL_RESERVATION_LEASE_SECONDS:-180}
      MODEL_INTERACTIVE_CONCURRENCY: ${MODEL_INTERACTIVE_CONCURRENCY:-4}
      MODEL_INTERACTIVE_RESERVE: ${MODEL_INTERACTIVE_RESERVE:-2}
      MODEL_PROBE_OVERFLOW_LIMIT: ${MODEL_PROBE_OVERFLOW_LIMIT:-0}
      HARNESS2_HOLDOUT_TIMEOUT_SECONDS: ${HARNESS2_HOLDOUT_TIMEOUT_SECONDS:-300}
      HARNESS_HOLDOUT_EVALUATOR_URL: ${HARNESS_HOLDOUT_EVALUATOR_URL:-}
      HARNESS_HOLDOUT_EVALUATOR_TOKEN: ${HARNESS_HOLDOUT_EVALUATOR_TOKEN:-}
      GITHUB_SECRET_REFERENCES_JSON: "${GITHUB_SECRET_REFERENCES_JSON:-{}}"
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_HTTP_TIMEOUT_SECONDS: ${GITHUB_HTTP_TIMEOUT_SECONDS:-10}
      GITHUB_WEBHOOK_MAX_BYTES: ${GITHUB_WEBHOOK_MAX_BYTES:-262144}
      GITHUB_WEBHOOK_MAX_ATTEMPTS: ${GITHUB_WEBHOOK_MAX_ATTEMPTS:-12}
    networks: [app_internal]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    volumes:
      - artifacts:/var/lib/harnessa/artifacts
    command: ["uv", "run", "--no-sync", "python", "-m", "harnessa.worker"]
    depends_on:
      api:
        condition: service_healthy
      litellm:
        condition: service_healthy
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3@sha256:f12d528d4a05add56cb09e54c5126088f2edc6bdf3a2f943bcd3a32b08769da2
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      # Keep this allowlist aligned with infra/litellm/config.yaml. Do not pass
      # credentials for providers with no configured deployment.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request',fromlist=['urlopen']).urlopen('http://127.0.0.1:4000/health/readiness',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [app_internal, provider_egress]
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
  qdrant:
    profiles: [retrieval]
    image: docker.io/qdrant/qdrant:v1.19.2@sha256:390ca16351185f9913c23d0c95ded0cdf2ce17e525dd7fbe58d3339c9c80e633
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    volumes:
      - qdrantdata:/qdrant/storage
    networks: [app_internal]
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; IFS= read -r response <&3; [[ "$$response" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata: {}
  artifacts: {}
  qdrantdata: {}
networks:
  app_internal:
    internal: true
  provider_egress: {}
