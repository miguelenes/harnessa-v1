# Register one unique LiteLLM model_name per deployment. The application selects
# one registered deployment per HTTP attempt; proxy-level retries/fallbacks stay off.
model_list:
  - model_name: harnessa-deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 60

  - model_name: harnessa-openrouter-deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60
      provider:
        order: [deepseek]
        allow_fallbacks: false

router_settings:
  num_retries: 0
  max_fallbacks: 0
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  # Keep the proxy ceiling at USD 20, below the user's EUR 20 remaining-
  # milestone ceiling with room for currency movement.
  # LiteLLM v1.83.14 requires a database for this proxy-wide spend check.
  max_budget: 20.00
  budget_duration: 30d

general_settings:
  database_url: os.environ/LITELLM_DATABASE_URL

# Provider keys are mapped only to the LiteLLM service in infra/compose.yaml.
# They are intentionally not passed to the API, worker, web, or agent containers.
