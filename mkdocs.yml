site_name: Harnessa
site_description: Documentation for the Harnessa open-source repository-change control plane.
site_url: https://docs.harnessa.cloud/
repo_url: https://github.com/miguelenes/harnessa-v1
repo_name: miguelenes/harnessa-v1
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Compatibility: compatibility.md
  - Development MCPs: development/mcp-servers.md
  - Retrieval and MCP integration: integrations/retrieval-mcp.md
  - Design system: design-system.md
  - Architecture decision:
      - Orchestration: adr/0004-run-orchestration.md
  - Milestones:
      - Milestone 1: milestones/01.md
      - Milestone 2: milestones/02.md
      - Milestone 3: milestones/03.md
      - Milestone 4: milestones/04.md
      - Milestone 5: milestones/05.md
      - Milestone 6: milestones/06.md
      - Milestone 7: milestones/07.md
      - Milestone 8: milestones/08.md
      - Web foundation: milestones/parallel-web-foundation.md
  - Contributing: contributing.md
  - Security: security.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
