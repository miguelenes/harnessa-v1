name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials and private data before submitting. For security issues, use private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and environment
      description: Include the commit or release, OS, and relevant runtime versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, passwords, personal data, and private URLs.
      render: text
