[project]
name = "harnessa"
version = "0.1.0"
description = "Harnessa modular control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn[standard]==0.38.0",
  "pydantic-settings==2.11.0",
  "sqlalchemy[asyncio]==2.0.44",
  "asyncpg==0.30.0",
  "alembic==1.17.0",
  "redis==6.4.0",
  "httpx==0.28.1",
  "fastapi-users[sqlalchemy]==14.0.1",
  "pwdlib[argon2]==0.2.1",
  "python-multipart==0.0.20",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "mypy==2.4.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
markers = ["integration: requires disposable real PostgreSQL and Redis services"]

[tool.mypy]
python_version = "3.12"
strict = true
