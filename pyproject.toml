[project]
name = "harnessa"
version = "0.1.0"
description = "Harnessa modular control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.1",
  "sqlalchemy[asyncio]==2.0.55",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "redis==8.1.0",
  "httpx==0.28.1",
  "fastapi-users[sqlalchemy]==15.0.5",
  "pwdlib[argon2]==0.3.0",
  "python-multipart==0.0.32",
  "agent-client-protocol==0.12.1",
]

[project.optional-dependencies]
retrieval = [
    "llama-index-core==0.14.25",
    "llama-index-vector-stores-qdrant==0.10.4",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves these declarations per request; they are not mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
markers = ["integration: requires disposable real PostgreSQL and Redis services"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["llama_index.*", "qdrant_client.*"]
ignore_missing_imports = true
